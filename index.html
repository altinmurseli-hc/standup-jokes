<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standup Jokes</title>
  <meta name="description" content="One clean joke for the daily standup. Pick a category, press Space.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥁</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Standup Jokes</h1>
      <p class="tagline">One clean joke before the status updates.</p>
    </header>

    <nav class="chips" id="categories" aria-label="Joke category"></nav>

    <section class="card" id="card" aria-live="polite">
      <p class="meta" id="meta">Press the button or hit <kbd>Space</kbd></p>
      <p class="setup" id="setup">Ready when you are.</p>
      <p class="punchline" id="punchline" hidden></p>
      <p class="drum" id="drum" hidden>🥁 ba-dum-tss</p>
    </section>

    <div class="actions">
      <button class="primary" id="go" type="button">Tell me a joke</button>
      <button class="ghost" id="copy" type="button" disabled>Copy</button>
    </div>

    <footer class="foot">
      Jokes from <a href="https://jokeapi.dev" target="_blank" rel="noopener">JokeAPI</a>,
      <a href="https://icanhazdadjoke.com" target="_blank" rel="noopener">icanhazdadjoke</a> and
      <a href="https://github.com/15Dkatz/official_joke_api" target="_blank" rel="noopener">Official Joke API</a>.
      Safe mode is always on.
    </footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
