<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standup Jokes</title>
  <meta name="description" content="One clean joke for the daily standup. Pick a category, press Space.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥁</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1>Standup Jokes</h1>
      <p class="tagline">One clean joke before the status updates.</p>
    </header>

    <nav class="chips" id="categories" aria-label="Joke category"></nav>

    <section class="card" id="card" aria-live="polite">
      <p class="meta" id="meta">Press the button or hit <kbd>Space</kbd></p>
      <p class="setup" id="setup">Ready when you are.</p>
      <p class="punchline" id="punchline" hidden></p>
      <p class="drum" id="drum" hidden>🥁 ba-dum-tss</p>
    </section>

    <div class="actions">
      <button class="ghost nav" id="back" type="button" aria-label="Previous joke" title="Previous joke (←)" disabled>‹</button>
      <button class="primary" id="go" type="button">Tell me a joke</button>
      <button class="ghost nav" id="forward" type="button" aria-label="Forward" title="Forward (→)" disabled>›</button>
    </div>

    <div class="tools">
      <button class="tool" id="fav" type="button" aria-pressed="false" disabled>☆ Save</button>
      <button class="tool" id="copy" type="button" disabled>📋 Copy</button>
      <button class="tool" id="remove" type="button" title="Never show this joke again (in this browser)" disabled>🚫 Remove joke</button>
      <button class="tool" id="big" type="button" title="Big screen (F)">⛶ Big screen</button>
    </div>

    <p class="keys"><kbd>Space</kbd> next · <kbd>←</kbd> <kbd>→</kbd> earlier jokes · <kbd>F</kbd> big screen</p>
    <p class="big-hint">Space next · ← → earlier jokes · F or Esc to exit</p>
  </main>
  <script src="jokes.js"></script>
  <script src="clean-jokes.js"></script>
  <script src="app.js"></script>
</body>
</html>
